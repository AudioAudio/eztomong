<script>
/* =========================================================
 * 게임 코어 (물리/드롭/합체/점수/게임오버)
 * 화면(UI)과 분리되어 있으며, 이벤트 콜백으로만 UI에 알림.
 *
 *  상태:  idle → playing ⇄ paused → over
 *  콜백:  onScore(score), onNext(currentTier, nextTier), onMaxTier(tierIndex),
 *         onDiscover(tierIndex), onGameOver({score, maxTier})
 * ========================================================= */
const Game = (() => {
  const { Engine, Bodies, Body, Composite, Events } = Matter;
  const B = CONFIG.board;
  const STEP = 1000 / 60;

  let canvas, g, cb = {};
  let engine, world;
  let state = 'idle';
  let score = 0, maxTier = 0;
  let currentTier = 0, nextTier = 0;
  let pointerX = (B.left + B.right) / 2;
  let lastDropAt = 0, now = 0;
  let mergeQueue = [];
  let dangerSince = null;
  let rafId = null, lastFrame = 0, acc = 0;
  let overAnim = 0;
  let slotMode = false;      // 이미지 자리 표시 (Slots.set / F2)
  let debugShapes = false;   // true 면 충돌 모양을 분홍 선으로 표시 (Game.debugShapes(true))

  /* ---------- 유틸 ---------- */
  function pickSpawnTier() {
    const w = CONFIG.drop.weights.slice(0, CONFIG.drop.spawnMaxTier);
    const total = w.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < w.length; i++) { if ((r -= w[i]) < 0) return i; }
    return 0;
  }
  const meta = (b) => b.plugin.cm;
  const objects = () => Composite.allBodies(world).filter((b) => b.plugin && b.plugin.cm);

  /* ---------- 월드 구성 ---------- */
  function buildWorld() {
    engine = Engine.create({ enableSleeping: false });
    engine.gravity.y = CONFIG.physics.gravityY;
    engine.positionIterations = 8;
    engine.velocityIterations = 6;
    world = engine.world;
    const w = B.wall, h = B.bottom - B.top + 400;
    const opt = { isStatic: true, friction: 0.5, restitution: 0.05 };
    Composite.add(world, [
      Bodies.rectangle(B.left - w / 2, B.bottom - h / 2, w, h, opt),
      Bodies.rectangle(B.right + w / 2, B.bottom - h / 2, w, h, opt),
      Bodies.rectangle((B.left + B.right) / 2, B.bottom + w / 2, B.right - B.left + w * 2, w, opt),
    ]);
    Events.on(engine, 'collisionStart', onCollision);
    Events.on(engine, 'collisionActive', onCollision);
  }

  /* ---------- 단계별 모양 (그림 윤곽 → 충돌 다각형) ----------
   * k       : 원본 이미지 1px 이 스테이지 몇 px 인지
   * verts   : 충돌 다각형 (스테이지 px, 이미지 중심 기준) / null 이면 원
   * imgSize : 이미지를 그릴 크기 (정사각)
   * offset  : 물리 중심(무게중심) → 이미지 중심까지 거리 (몸체 로컬 좌표)
   * halfW / halfH : 회전 전 반폭/반높이 (드로퍼 위치 제한, 연출용)
   */
  const shapeCache = [];
  function shapeOf(tierIndex) {
    if (shapeCache[tierIndex]) return shapeCache[tierIndex];
    const t = CONFIG.tiers[tierIndex];
    const r = t.radius * (t.sizeScale || 1) * (CONFIG.shapes.gameScale || 1);
    const S = (typeof SHAPES !== 'undefined') && SHAPES[t.id];
    let shape;
    if (CONFIG.shapes.mode === 'outline' && S && !Assets.isPlaceholder(tierIndex)) {
      const k = Math.sqrt((Math.PI * r * r * CONFIG.shapes.fill) / S.area);
      const verts = S.verts.map(([x, y]) => ({ x: x * k, y: y * k }));
      const c = Matter.Vertices.centre(verts);
      shape = {
        k, verts, imgSize: S.src * k,
        offset: { x: -c.x, y: -c.y },
        halfW: (S.width * k) / 2, halfH: (S.height * k) / 2,
      };
    } else {
      // 원형 (플레이스홀더 또는 circle 모드): 그림 내용 폭 ≈ 지름
      const src = S ? S.src : 512;
      const contentW = S ? Math.max(S.width, S.height) : src * 0.85;
      const k = (r * 2.08) / contentW;
      shape = { k, verts: null, r, imgSize: src * k, offset: { x: 0, y: 0 }, halfW: r, halfH: r };
    }
    return (shapeCache[tierIndex] = shape);
  }

  function createObject(tierIndex, x, y, { spawned = false } = {}) {
    const p = CONFIG.physics;
    const sh = shapeOf(tierIndex);
    const opts = {
      restitution: p.restitution, friction: p.friction, frictionStatic: p.frictionStatic,
      frictionAir: p.frictionAir, density: p.density,
    };
    const body = sh.verts
      ? Bodies.fromVertices(x, y, [sh.verts], opts)
      : Bodies.circle(x, y, sh.r, opts);
    // fromVertices 는 무게중심을 (x, y)에 둠 → 이미지 중심이 (x, y)에 오도록 보정
    if (sh.verts) Body.setPosition(body, { x: x - sh.offset.x, y: y - sh.offset.y });
    body.plugin = { cm: {
      tier: tierIndex, born: now, merging: false,
      falling: !spawned,            // 드롭 직후 첫 충돌 전까지 true
      squash: 0,                    // 착지 찌그러짐 (0~1)
      pop: spawned ? 0 : 1,         // 합체 생성 팝업 애니메이션 진행도
    } };
    Composite.add(world, body);
    return body;
  }

  /* ---------- 충돌 / 합체 ---------- */
  function onCollision(e) {
    for (const pair of e.pairs) {
      const a = pair.bodyA.parent, b = pair.bodyB.parent;
      const ma = a.plugin && a.plugin.cm, mb = b.plugin && b.plugin.cm;

      // 착지 연출 (드롭 후 첫 충돌)
      for (const [body, m] of [[a, ma], [b, mb]]) {
        if (m && m.falling && e.name === 'collisionStart') {
          m.falling = false;
          const speed = Math.min(body.speed, 14);
          m.squash = Math.min(0.22, speed / 50);
          if (speed > 3) {
            Effects.dust(body.position.x, body.bounds.max.y, shapeOf(m.tier).halfW);
            Sound.play('land', { pitch: 1.3 - m.tier * 0.05 });
          }
        }
      }
      // 같은 단계끼리 합체
      if (ma && mb && ma.tier === mb.tier && !ma.merging && !mb.merging) {
        ma.merging = mb.merging = true;
        mergeQueue.push([a, b]);
      }
    }
  }

  function processMerges() {
    for (const [a, b] of mergeQueue) {
      const tier = meta(a).tier;
      const x = (a.position.x + b.position.x) / 2;
      const y = (a.position.y + b.position.y) / 2;
      Composite.remove(world, [a, b]);

      if (tier === CONFIG.tiers.length - 1) {
        // 최종 단계 + 최종 단계 → 둘 다 사라지고 보너스
        addScore(CONFIG.maxMergeBonus, x, y, '#ff7eb6');
        Effects.mergeBurst(x, y, CONFIG.tiers[tier].radius * 1.4, tier);
        Sound.play('mergeBig');
        continue;
      }
      const nt = tier + 1;
      const nb = createObject(nt, x, y, { spawned: true });
      Body.setVelocity(nb, {
        x: (a.velocity.x + b.velocity.x) / 2,
        y: Math.min((a.velocity.y + b.velocity.y) / 2, 0) - 1,
      });
      addScore(CONFIG.tiers[nt].score, x, y);
      Effects.mergeBurst(x, y, CONFIG.tiers[nt].radius, nt);
      Sound.play(nt >= 7 ? 'mergeBig' : 'merge', { pitch: 1.4 - nt * 0.06 });
      Store.get().stats.merges++;

      Store.addCount(nt);
      if (Store.discover(nt) && cb.onDiscover) cb.onDiscover(nt);
      if (nt > maxTier) { maxTier = nt; cb.onMaxTier && cb.onMaxTier(maxTier); }
    }
    mergeQueue = [];
  }

  function addScore(v, x, y, color) {
    score += v;
    Effects.floatText(x, y - 10, `+${v}`, color);
    cb.onScore && cb.onScore(score);
  }

  /* ---------- 게임오버 판정 ---------- */
  function checkDanger() {
    let over = false;
    for (const b of objects()) {
      const m = meta(b);
      if (m.merging || now - m.born < B.spawnGraceMs) continue;
      if (b.bounds.min.y < B.dangerY && b.speed < 2.5) { over = true; break; }
    }
    if (over) {
      if (dangerSince === null) dangerSince = now;
      if (now - dangerSince >= B.dangerHoldMs) endGame();
    } else dangerSince = null;
  }

  function endGame() {
    if (state !== 'playing') return;
    state = 'over';
    overAnim = 0;
    Sound.stopBgm(0.5);
    Sound.play('gameover');
    const result = { score, maxTier };
    setTimeout(() => cb.onGameOver && cb.onGameOver(result), 1100);
  }

  /* ---------- 입력 ---------- */
  function clampX(x) {
    const r = shapeOf(currentTier).halfW;
    return Math.max(B.left + r + 1, Math.min(B.right - r - 1, x));
  }
  function setPointerX(x) { pointerX = x; }
  function nudge(dx) { pointerX = clampX(pointerX + dx); }
  function canDrop() { return state === 'playing' && now - lastDropAt >= CONFIG.drop.cooldownMs; }

  function drop() {
    if (!canDrop()) return false;
    const b = createObject(currentTier, clampX(pointerX), dropYFor(currentTier));
    meta(b).falling = true;
    Store.addCount(meta(b).tier);
    if (Store.discover(meta(b).tier) && cb.onSeen) cb.onSeen(meta(b).tier);   // 1~5단계는 떨어뜨리기만 해도 도감에 등록 (알림 없이)
    Body.setVelocity(b, { x: 0, y: 2 });
    lastDropAt = now;
    Sound.play('drop');
    currentTier = nextTier;
    nextTier = pickSpawnTier();
    cb.onNext && cb.onNext(currentTier, nextTier);
    return true;
  }

  /* ---------- 렌더 ---------- */
  /* 유리 상자 프레임 배치: 이미지의 안쪽 벽/바닥선이 물리 벽/바닥과 정확히 겹치도록 균일 스케일 */
  function frameLayout() {
    const fa = B.frameArt;
    const k = (B.right - B.left) / (fa.innerRight - fa.innerLeft);
    return { k, x: B.left - fa.innerLeft * k, y: B.bottom - fa.innerBottom * k };
  }

  /* 드로퍼 (dropper.png): 포인터를 따라다니며 다음 오브젝트를 들고 있는 그림 */
  function holderLayout() {
    const d = Assets.dropper();
    if (!d) return null;
    const s = B.holder.scale;
    return { cloud: d.img, s, w: d.img.width * s, h: d.img.height * s, top: B.holder.top,
             bottom: B.holder.top + d.visibleBottom * s };
  }

  /** 드로퍼에 매달린 오브젝트의 중심 y (구름 아래에 살짝 겹쳐 매달림) */
  function dropYFor(tierIndex) {
    const h = holderLayout();
    if (!h) return B.dropY;
    return h.bottom - B.holder.overlap + shapeOf(tierIndex).halfH;
  }

  function drawBox() {
    if (B.drawFrame === false) return;   // 플레이 v3.8: 유리 상자가 배경 스킨에 그려져 있음
    const img = Assets.image('box');
    if (img) {
      const f = frameLayout();
      g.drawImage(img, f.x, f.y, img.width * f.k, img.height * f.k);
      return;
    }
    // 유리 상자 (플레이스홀더)
    g.save();
    g.fillStyle = 'rgba(255, 255, 255, 0.10)';
    g.fillRect(B.left, B.top - 40, B.right - B.left, B.bottom - B.top + 40);
    g.strokeStyle = 'rgba(255, 255, 255, 0.75)';
    g.lineWidth = 5;
    g.beginPath();
    g.moveTo(B.left - 2, B.top - 40); g.lineTo(B.left - 2, B.bottom + 2);
    g.lineTo(B.right + 2, B.bottom + 2); g.lineTo(B.right + 2, B.top - 40);
    g.stroke();
    // 유리 반사 하이라이트
    g.fillStyle = 'rgba(255,255,255,0.18)';
    g.fillRect(B.left + 10, B.top - 30, 10, B.bottom - B.top);
    // 받침대
    g.fillStyle = 'rgba(170, 150, 230, 0.9)';
    g.beginPath(); g.roundRect(B.left - 16, B.bottom + 4, B.right - B.left + 32, 16, 8); g.fill();
    g.restore();
  }

  function drawDangerLine() {
    const active = dangerSince !== null;
    const pulse = active ? 0.5 + 0.5 * Math.sin(now / 90) : 0;
    g.save();
    g.setLineDash([10, 8]);
    g.lineWidth = active ? 3 : 2;
    g.strokeStyle = active ? `rgba(255, 90, 120, ${0.6 + pulse * 0.4})` : 'rgba(255,255,255,0.45)';
    g.beginPath(); g.moveTo(B.left, B.dangerY); g.lineTo(B.right, B.dangerY); g.stroke();
    g.restore();
  }

  /** (x, y) = 물리 중심. offset 으로 이미지 중심을 맞춰 그림 */
  function drawSprite(tierIndex, x, y, angle, sx = 1, sy = 1, alpha = 1, useOffset = true) {
    const sh = shapeOf(tierIndex);
    const s = sh.imgSize;
    const ox = useOffset ? sh.offset.x : 0, oy = useOffset ? sh.offset.y : 0;
    g.save();
    g.globalAlpha = alpha;
    g.translate(x, y);
    g.scale(sx, sy);
    g.rotate(angle);
    g.drawImage(Assets.getSprite(tierIndex), ox - s / 2, oy - s / 2, s, s);
    if (debugShapes && sh.verts) {
      g.strokeStyle = 'rgba(255,60,120,0.9)'; g.lineWidth = 1.5;
      g.beginPath(); sh.verts.forEach((v, i) => g[i ? 'lineTo' : 'moveTo'](v.x + ox, v.y + oy)); g.closePath(); g.stroke();
    }
    g.restore();
  }

  function easeOutBack(t) { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  function drawDropper() {
    if (state !== 'playing') return;
    const x = clampX(pointerX);
    const ready = canDrop();
    const y = dropYFor(currentTier);
    if (Store.get().settings.guide) {
      g.save();
      g.strokeStyle = 'rgba(255,255,255,0.35)';
      g.setLineDash([4, 10]); g.lineWidth = 2;
      g.beginPath(); g.moveTo(x, y + shapeOf(currentTier).halfH); g.lineTo(x, B.bottom); g.stroke();
      g.restore();
    }
    const bob = Math.sin(now / 300) * 3;
    // 새로 매달린 가구가 눈에 띄도록: 떨어뜨린 직후(쿨다운 동안) 구름 아래에서 톡 커지며 나타남.
    //  - 크기 0.55 → 1 (살짝 튀었다 자리잡음), 위쪽(구름에 매달린 쪽) 기준으로 커짐
    //  - 쿨다운 중 투명도 0.8 (예전 0.45 는 너무 흐려서 다음 가구가 안 보였음)
    const t = Math.min(1, (now - lastDropAt) / CONFIG.drop.cooldownMs);
    const pop = t >= 1 ? 1 : 0.55 + 0.45 * easeOutBack(t);
    const hh = shapeOf(currentTier).halfH;
    drawSprite(currentTier, x, y + bob - hh * (1 - pop), 0, pop, pop, ready ? 1 : 0.8, false);
    // 오브젝트를 들고 있는 구름 (오브젝트 윗부분을 살짝 덮음)
    const h = holderLayout();
    if (h) g.drawImage(h.cloud, x - h.w / 2, h.top + bob, h.w, h.h);
  }

  function drawObjects() {
    const list = objects().sort((a, b) => meta(a).tier - meta(b).tier);
    for (const b of list) {
      const m = meta(b);
      // 떨어질 때 속도선
      if (m.falling && b.speed > 4) {
        g.save();
        g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 2;
        for (const dx of [-0.5, 0, 0.5]) {
          const lx = b.position.x + dx * shapeOf(m.tier).halfW;
          g.beginPath();
          g.moveTo(lx, b.bounds.min.y - 6);
          g.lineTo(lx, b.bounds.min.y - 6 - b.speed * 2.5);
          g.stroke();
        }
        g.restore();
      }
      const sq = m.squash;
      const pop = m.pop < 1 ? 0.6 + 0.4 * easeOutBack(m.pop) : 1;
      // 착지 찌그러짐은 아래쪽 기준
      const sy = (1 - sq) * pop, sx = (1 + sq) * pop;
      const yOff = (b.bounds.max.y - b.position.y) * sq;
      const dim = state === 'over' ? 1 - Math.min(overAnim, 1) * 0.35 : 1;
      drawSprite(m.tier, b.position.x, b.position.y + yOff, b.angle, sx, sy, dim);
    }
  }

  function easeOutBack(t) { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

  function render() {
    g.clearRect(0, 0, canvas.width, canvas.height);
    drawBox();
    drawDangerLine();
    drawObjects();
    drawDropper();
    Effects.draw(g);
    if (slotMode) drawSlots();
  }

  /* ---------- 이미지 자리 표시 (아트 확인용) ---------- */
  function slotTag(text, x, y, color = 'rgba(255,61,154,0.92)') {
    g.save();
    g.font = '12px sans-serif';
    const w = g.measureText(text).width + 12;
    g.fillStyle = color; g.fillRect(x, y, w, 18);
    g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.fillText(text, x + 6, y + 9.5);
    g.restore();
  }
  function slotRect(x, y, w, h, color = '#ff3d9a') {
    g.save(); g.setLineDash([6, 4]); g.lineWidth = 2; g.strokeStyle = color; g.strokeRect(x, y, w, h); g.restore();
  }
  function drawSlots() {
    // 유리 상자: 이미지 전체 자리 + 안쪽 벽·바닥 기준선
    const f = frameLayout(), fa = B.frameArt;
    const img = Assets.image('box');
    const bw = img ? img.width : 520, bh = img ? img.height : 620;
    slotRect(f.x, f.y, bw * f.k, bh * f.k);
    g.save(); g.strokeStyle = 'rgba(24,198,224,0.95)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(B.left, B.top - 40); g.lineTo(B.left, B.bottom); g.lineTo(B.right, B.bottom); g.lineTo(B.right, B.top - 40); g.stroke(); g.restore();
    slotTag(`glass_box.png · ${bw}×${bh}  (안쪽 벽 x${fa.innerLeft}·x${fa.innerRight}, 바닥 y${fa.innerBottom} → 하늘색 선)`, f.x, f.y + bh * f.k + 2);
    slotTag('게임오버 선 (코드로 그림, 이미지 아님)', B.left + 4, B.dangerY + 3, 'rgba(90,80,140,0.9)');
    // 드로퍼
    if (state === 'playing' || state === 'paused') {
      const d = Assets.dropper(), s = B.holder.scale;
      const dw = (d ? d.img.width : 360) * s, dh = (d ? d.img.height : 180) * s;
      const x = clampX(pointerX);
      slotRect(x - dw / 2, B.holder.top, dw, dh);
      slotTag(`dropper.png · ${d ? d.img.width : 360}×${d ? d.img.height : 180}`, x - dw / 2, B.holder.top + dh + 2);
    }
    // 오브젝트: 이미지 자리(정사각) + 파일명 (같은 단계는 하나에만 이름표)
    const tagged = new Set();
    for (const b of objects()) {
      const m = meta(b), sh = shapeOf(m.tier), t = CONFIG.tiers[m.tier];
      const cx = b.position.x + sh.offset.x, cy = b.position.y + sh.offset.y;
      g.save(); g.globalAlpha = 0.45; slotRect(cx - sh.imgSize / 2, cy - sh.imgSize / 2, sh.imgSize, sh.imgSize); g.restore();
      if (tagged.has(m.tier)) continue;
      tagged.add(m.tier);
      slotTag(`obj_${String(t.id).padStart(2, '0')} · 512×512 → 화면 ${Math.round(sh.imgSize)}`, cx - sh.imgSize / 2, cy - sh.imgSize / 2 - 18);
    }
  }

  /* ---------- 루프 ---------- */
  function tick(ts) {
    rafId = requestAnimationFrame(tick);
    const dt = Math.min(ts - (lastFrame || ts), 100);
    lastFrame = ts;
    if (state === 'playing') {
      acc += dt;
      while (acc >= STEP) {
        now += STEP;
        Engine.update(engine, STEP);
        processMerges();
        acc -= STEP;
      }
      for (const b of objects()) {
        const m = meta(b);
        m.squash *= 0.82;
        if (m.pop < 1) m.pop = Math.min(1, m.pop + dt / 220);
      }
      checkDanger();
      Effects.update(dt / 1000);
    } else if (state === 'over') {
      overAnim += dt / 1000;
      Effects.update(dt / 1000);
    }
    render();
  }

  /* ---------- 공개 API ---------- */
  function init(cv, callbacks) {
    canvas = cv; g = canvas.getContext('2d'); cb = callbacks || {};
  }

  function start() {
    if (engine) { Events.off(engine); Composite.clear(engine.world, false); Engine.clear(engine); }
    buildWorld();
    Effects.clear();
    state = 'playing';
    score = 0; maxTier = 0; now = 0; acc = 0; lastDropAt = -9999;
    mergeQueue = []; dangerSince = null;
    currentTier = pickSpawnTier(); nextTier = pickSpawnTier();
    cb.onScore && cb.onScore(0);
    cb.onNext && cb.onNext(currentTier, nextTier);
    cb.onMaxTier && cb.onMaxTier(0);
    if (!rafId) { lastFrame = 0; rafId = requestAnimationFrame(tick); }
  }

  function pause()  { if (state === 'playing') state = 'paused'; }
  function resume() { if (state === 'paused') { state = 'playing'; lastFrame = 0; } }
  function stop()   { state = 'idle'; if (rafId) cancelAnimationFrame(rafId); rafId = null; }

  return {
    init, start, pause, resume, stop, drop, setPointerX, nudge,
    get state() { return state; },
    get score() { return score; },
    // 디버그/테스트용
    _debugSpawn: (tier, x, y) => createObject(tier, x, y, { spawned: true }),
    _bodies: () => (world ? objects().map((b) => ({ tier: meta(b).tier + 1, x: Math.round(b.position.x), y: Math.round(b.position.y) })) : []),
    debugShapes: (on) => { debugShapes = !!on; },
    setSlots: (on) => { slotMode = !!on; },
    /** 단계별 화면 크기 (도감 상세 표시용): 그림 윤곽 기준 폭×높이 */
    sizeOf: (tierIndex) => { const sh = shapeOf(tierIndex); return { w: Math.round(sh.halfW * 2), h: Math.round(sh.halfH * 2) }; },
  };
})();

</script>
<script>
/* =========================================================
 * 화면 진행 (Screen Flow) + HUD   — v1.0 (승인 시안 배치)
 *
 *  loading → title ─┬─ start ──→ game ──(pause)──→ [일시정지: 계속 / 다시 / 옵션 / 타이틀로]
 *                   ├─ codex (도감)
 *                   ├─ settings (옵션)
 *                   └─ ranking (랭킹)
 *            game ──(게임오버)──→ gameover ─┬ 닉네임 입력 → 랭킹 등록
 *                                            ├ home → title
 *                                            ├ retry → game
 *                                            └ ranking → (닫기) gameover
 * ========================================================= */
const UI = (() => {
  const $ = (id) => document.getElementById(id);
  let current = 'loading';
  let returnTo = 'title';     // 도감/옵션/랭킹에서 '닫기' 로 돌아갈 곳
  let lastResult = null;
  let toastTimer = null;
  let lastMax = 0;
  let rankTab = 'all';

  const SCREENS = ['loading', 'title', 'game', 'gameover', 'codex', 'settings', 'ranking'];

  /* ---------- 화면 전환 ---------- */
  function show(name) {
    for (const s of SCREENS) $('screen-' + s).classList.toggle('active', s === name);
    current = name;
    if (name === 'title') $('title-best').textContent = Store.get().best.toLocaleString();
    if (name === 'codex') renderCodex();
    if (name === 'settings') renderSettings();
    if (name === 'ranking') renderRanking();
  }
  function showOverlay(on) { $('overlay-pause').classList.toggle('active', on); }

  /* ---------- 게임 안 확인 창 (브라우저 confirm 대신: OBS 브라우저 소스에서는 confirm 이 안 뜰 수 있음) ---------- */
  function confirmDialog(title, text, okLabel = '확인') {
    return new Promise((resolve) => {
      const ov = $('overlay-confirm');
      $('confirm-title').textContent = title;
      $('confirm-text').textContent = text;
      $('confirm-yes').textContent = okLabel;
      ov.classList.add('active');
      const done = (v) => {
        ov.classList.remove('active');
        $('confirm-yes').onclick = $('confirm-no').onclick = null;
        window.removeEventListener('keydown', onKey, true);
        Sound.play('click');
        resolve(v);
      };
      const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
      $('confirm-yes').onclick = () => done(true);
      $('confirm-no').onclick = () => done(false);
      window.addEventListener('keydown', onKey, true);
    });
  }

  /* ---------- 액션 (data-action 버튼) ---------- */
  const actions = {
    start()   { startGame(); },
    retry()   { showOverlay(false); startGame(); },
    pause()   { if (Game.state === 'playing') { Game.pause(); Sound.pauseBgm(); showOverlay(true); } },
    resume()  { showOverlay(false); Game.resume(); Sound.resumeBgm(); },
    home()    { showOverlay(false); Game.stop(); Sound.stopBgm(); show('title'); },
    codex()   { returnTo = current; show('codex'); },
    settings(){
      // 일시정지 중 옵션 → 닫으면 일시정지 화면으로
      returnTo = current === 'game' ? 'pause' : current;
      showOverlay(false); show('settings');
    },
    ranking() { returnTo = current; rankTab = 'all'; show('ranking'); },
    back() {
      if (returnTo === 'pause') { show('game'); showOverlay(true); }
      else show(returnTo || 'title');
    },
    async 'reset-data'() {
      const ok = await confirmDialog('기록 초기화', '최고 점수, 도감, 랭킹 기록을\n모두 지울까요?\n(옵션 설정은 유지돼요)', '지우기');
      if (!ok) return;
      const settings = { ...Store.get().settings };
      Store.reset();
      Object.assign(Store.get().settings, settings); Store.save();
      lastResult = null;
      renderSettings();
      toast('기록을 모두 지웠어요');
    },
  };

  function bindActions() {
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const fn = actions[btn.dataset.action];
      if (fn) { Sound.unlock(); Sound.play('click'); fn(); }
    });
    document.querySelectorAll('.rank-tab').forEach((b) => {
      b.addEventListener('click', () => { Sound.play('click'); rankTab = b.dataset.tab; renderRanking(); });
    });
  }

  function startGame() {
    show('game');
    Sound.startBgm();
    Game.start();
  }

  /* ---------- HUD ---------- */
  function buildEvoList() {
    const ul = $('hud-evo');
    ul.innerHTML = '';
    for (let i = 0; i < CONFIG.tiers.length; i++) {       // 시안: 위가 1단계, 아래가 11단계
      const li = document.createElement('li');
      li.dataset.tier = i;
      const n = document.createElement('span'); n.className = 'evo-num'; n.textContent = CONFIG.tiers[i].id;
      li.append(n, Assets.thumbnail(i, 36));
      ul.appendChild(li);
    }
  }

  function setScore(v) {
    const el = $('hud-score');
    Digits.set(el, v);
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  }

  function setNext(cur, next) {
    const slot = $('hud-next');
    slot.innerHTML = '';
    slot.appendChild(Assets.thumbnail(next, 110));
  }

  function setMaxTier(maxTier) {
    lastMax = maxTier;
    Digits.set($('hud-best'), Store.get().best);
    refreshEvo();
  }
  function refreshEvo() {
    const disc = Store.get().discovered;
    for (const li of $('hud-evo').children) {
      const i = +li.dataset.tier;
      li.classList.toggle('current', Game.state !== 'idle' && i === lastMax);
      li.classList.toggle('reached', i < lastMax);
      li.classList.toggle('locked', !disc[i]);
    }
  }

  function toast(content, ms = 1800) {
    const t = $('toast');
    t.innerHTML = '';
    if (content instanceof Node) t.appendChild(content); else t.textContent = content;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  function onDiscover(tierIndex) {
    const wrap = document.createElement('span');
    wrap.style.display = 'flex'; wrap.style.alignItems = 'center'; wrap.style.gap = '10px';
    wrap.appendChild(Assets.thumbnail(tierIndex, 36));
    const txt = document.createElement('span'); txt.innerHTML = '새로운 발견!<br>'; txt.appendChild(document.createTextNode(CONFIG.tiers[tierIndex].name));
    wrap.appendChild(txt);
    toast(wrap);
    refreshEvo();
  }
  function onSeen() { refreshEvo(); }   // 떨어뜨려서 처음 본 단계 (알림 없이 도감·진화도만 갱신)

  /* ---------- 03 게임 종료 ---------- */
  function onGameOver({ score, maxTier }) {
    const { isNewBest, rank } = Store.finishGame(score, maxTier);
    lastResult = { score, maxTier, rank: null, registered: false };
    show('gameover');                              // 먼저 보이게 해야 숫자 크기를 계산할 수 있음
    Digits.set($('go-score'), score);
    $('go-best').textContent = Store.get().best.toLocaleString();
    $('go-new').classList.toggle('show', isNewBest);
    $('go-bubble').classList.toggle('show', isNewBest && score > 0);
    const tierEl = $('go-tier');
    tierEl.innerHTML = '';
    tierEl.appendChild(Assets.thumbnail(maxTier, 34));
    tierEl.appendChild(document.createTextNode(`최고 진화: ${CONFIG.tiers[maxTier].name}`));
    setRegisterState(rank ? 'open' : (score > 0 ? 'out' : 'zero'), rank);
    Sound.stopBgm();
    if (rank) setTimeout(() => { const n = $('go-name'); n.focus(); n.select(); }, 250);
  }

  /* ---------- 랭킹 등록 ---------- */
  // state: open(입력 가능) / done(등록 완료) / out(보관 한도 밖) / zero(0점 → 영역 숨김)
  function setRegisterState(state, rank) {
    const msg = $('go-rank-msg'), row = $('go-rank-row');
    $('go-register').dataset.state = state;
    row.style.display = state === 'open' ? '' : 'none';
    msg.classList.remove('warn');
    if (state === 'open') {
      msg.textContent = rank <= Store.RANK_SIZE ? `${rank}위 기록이에요! 닉네임을 입력하고 랭킹에 등록하세요` : `${rank}위 기록이에요. 닉네임을 입력하고 등록하세요`;
      $('go-name').value = Store.get().lastName || '';
      $('go-submit').disabled = false;
    } else if (state === 'done') {
      msg.textContent = `랭킹 ${rank}위로 등록했어요!`;
    } else if (state === 'out') {
      msg.textContent = '랭킹에 등록할 수 없는 점수예요';
    } else {
      msg.textContent = '';
    }
  }

  function bindRegister() {
    $('go-register').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!lastResult || lastResult.registered) return;
      const input = $('go-name');
      if (!Store.cleanName(input.value)) {
        const msg = $('go-rank-msg');
        msg.textContent = '닉네임을 입력해 주세요';
        msg.classList.add('warn');
        input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');
        input.focus();
        return;
      }
      const rank = Store.registerRank(input.value, lastResult.score, lastResult.maxTier);
      if (!rank) { setRegisterState('out'); return; }
      Sound.play('click');
      lastResult.registered = true; lastResult.rank = rank;
      $('go-submit').disabled = true;
      input.blur();
      setRegisterState('done', rank);
    });
  }

  /* ---------- 05 도감 ---------- */
  function renderCodex(selected) {
    const grid = $('codex-grid');
    const st = Store.get(), disc = st.discovered, counts = st.counts || [];
    grid.innerHTML = '';
    const count = disc.filter(Boolean).length;
    $('codex-count').textContent = `${count} / ${CONFIG.tiers.length}`;
    if (selected === undefined) selected = Math.max(0, disc.lastIndexOf(true));
    CONFIG.tiers.forEach((t, i) => {
      const cell = document.createElement('div');
      cell.className = 'codex-cell' + (disc[i] ? '' : ' locked') + (i === selected ? ' selected' : '');
      const num = document.createElement('span'); num.className = 'num'; num.textContent = t.id;
      const name = document.createElement('span'); name.className = 'name'; name.textContent = disc[i] ? shortName(t) : '???';
      const v25 = Assets.kit('codex25');   // 도감 v2.5: 칸 안 그림 영역 110×91, 못 찾은 칸은 받은 실루엣 그림
      const pic = disc[i] ? Assets.thumbnail(i, v25 ? 91 : 70) : (v25 ? silhouette() : lockIcon(42));   // 못 찾은 칸: 받은 자물쇠 아이콘 (그림을 검게 칠하지 않음)
      cell.append(num, pic, name);
      cell.onclick = () => { Sound.play('click'); renderCodex(i); };
      grid.appendChild(cell);
    });
    const t = CONFIG.tiers[selected];
    const d = $('codex-detail');
    d.innerHTML = '';
    const box = document.createElement('div'); box.className = 'd-img';
    const big = Assets.kit('codex25') ? 200 : 150;   // v2.5: 상세 그림 최대 290×200
    box.appendChild(disc[selected] ? Assets.thumbnail(selected, big) : (Assets.kit('codex25') ? silhouette('big') : lockIcon(72)));
    const info = document.createElement('div');
    if (disc[selected]) {
      const sz = Game.sizeOf(selected);
      const from = selected > 0 ? `${CONFIG.tiers[selected - 1].name} 2개를 합쳐서 탄생` : '처음부터 떨어지는 가구';
      info.innerHTML = `<div class="d-name"></div><div class="d-size"></div><div class="d-desc"></div>
        <div class="d-meta"><span class="chip">획득 개수<b></b></span><span class="chip">만들면<b></b></span><span class="chip from"></span></div>`;
      info.querySelector('.d-name').textContent = `${t.id}. ${shortName(t)}`;
      info.querySelector('.d-size').textContent = `${sz.w} × ${sz.h}`;
      info.querySelector('.d-desc').textContent = t.desc || '';
      const chips = info.querySelectorAll('.chip b');
      chips[0].textContent = (counts[selected] || 0).toLocaleString();
      chips[1].textContent = `+${t.score}점`;
      info.querySelector('.chip.from').textContent = from;
    } else {
      info.innerHTML = `<div class="d-name">${t.id}. ???</div><div class="d-desc">아직 발견하지 못했어요. ${selected > 0 ? '아래 단계 가구 2개를 합쳐 보세요!' : ''}</div>`;
    }
    d.append(box, info);
  }
  const shortName = (t) => t.name.replace(/^구름\s*/, '');
  function silhouette(cls = '') { const img = new Image(); img.alt = ''; img.className = 'codex-sil ' + cls; const p = 'assets/codex/codex_locked_silhouette.png'; img.src = (window.__ASSET_DATA && window.__ASSET_DATA[p]) || p; return img; }
  function lockIcon(px) { const w = document.createElement('span'); w.innerHTML = '<i data-ico="lock" class="lock-ico"></i>'; Icons.apply(w); const i = w.firstChild; i.style.width = i.style.height = px + 'px'; return i; }   // 시안 표기: '조각', '침대' …

  /* ---------- 04 옵션 ---------- */
  function renderSettings() {
    const s = Store.get().settings;
    const bgm = $('set-bgm'), sfx = $('set-sfx'), guide = $('set-guide');
    bgm.value = s.bgm; sfx.value = s.sfx; guide.checked = s.guide;
    bgm.oninput = () => { s.bgm = +bgm.value; Sound.updateVolume(); Store.save(); };
    sfx.oninput = () => { s.sfx = +sfx.value; Sound.updateVolume(); Store.save(); };
    sfx.onchange = () => Sound.play('merge');
    guide.onchange = () => { s.guide = guide.checked; Store.save(); };
  }

  /* ---------- 06 랭킹 ---------- */
  function rankRow(r, pos, { latest = false } = {}) {
    const li = document.createElement('li');
    li.className = (latest ? 'latest ' : '') + (pos <= 3 ? `top r${pos}` : '');   // v2.8: 1~3위 행 그림
    const badge = document.createElement('span'); badge.className = 'rank-badge' + (pos <= 3 ? ` r${pos}` : ''); badge.textContent = pos;
    const av = document.createElement('span'); av.className = 'rank-avatar'; av.appendChild(Assets.thumbnail(r.maxTier ?? 0, 32));
    av.title = `최고 진화: ${CONFIG.tiers[r.maxTier ?? 0].name}`;
    const name = document.createElement('span'); name.className = 'name'; name.textContent = r.name || '-';
    const sc = document.createElement('span'); sc.className = 'score num'; sc.dataset.num = 'purple';
    const date = document.createElement('span'); date.className = 'date'; date.textContent = (r.date || '').replace(/-/g, '.');
    li.append(badge, av, name, sc, date);
    return { li, sc, score: r.score };
  }

  function renderRanking() {
    document.querySelectorAll('.rank-tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === rankTab));
    const ol = $('ranking-list');
    const st = Store.get();
    const me = st.lastName;
    ol.innerHTML = '';
    const nums = [];
    let rows;
    if (rankTab === 'all') rows = st.ranking.slice(0, Store.RANK_SIZE).map((r, i) => ({ r, pos: i + 1 }));
    else rows = Store.recordsOf(me).slice(0, Store.RANK_SIZE).map((r) => ({ r, pos: r.rank }));
    if (!rows.length) {
      ol.innerHTML = `<div class="ranking-empty">${rankTab === 'all' ? '아직 등록된 기록이 없어요' : (me ? `'${escapeHtml(me)}' 이름의 기록이 없어요` : '게임이 끝난 뒤 닉네임을 등록하면<br>내 기록이 여기에 모여요')}</div>`;
    }
    for (const { r, pos } of rows) {
      const latest = lastResult && lastResult.registered && lastResult.rank === pos;
      const row = rankRow(r, pos, { latest });
      ol.appendChild(row.li); nums.push(row);
    }
    // 내 순위 (전체 랭킹 탭 아래 고정): 내 닉네임의 최고 기록
    const my = $('my-rank');
    my.innerHTML = '';
    const mine = Store.recordsOf(me);
    if (rankTab === 'all' && me) {
      my.classList.add('show');
      const lab = document.createElement('span'); lab.className = 'my-label'; lab.textContent = '내 순위';
      if (mine.length) {
        const b = mine[0];
        const pos = document.createElement('span'); pos.className = 'my-pos'; pos.textContent = b.rank;
        const name = document.createElement('span'); name.className = 'name'; name.textContent = b.name;
        const sc = document.createElement('span'); sc.className = 'score num'; sc.dataset.num = 'gold';
        const date = document.createElement('span'); date.className = 'date'; date.textContent = (b.date || '').replace(/-/g, '.');
        my.append(lab, pos, name, sc, date);
        nums.push({ sc, score: b.score });
      } else {
        const hint = document.createElement('span'); hint.className = 'hint'; hint.textContent = `'${me}' 이름으로 등록된 기록이 아직 없어요`;
        my.append(lab, document.createElement('span'), hint);
      }
    } else my.classList.remove('show');
    // 숫자 이미지는 화면에 붙은 뒤 크기 계산이 가능해서 마지막에
    // 랭킹 v2.9: 승인 시안처럼 점수는 숫자 그림 대신 글자 (1,000 단위 쉼표)
    if (Assets.kit('rank29')) for (const n of nums) { n.sc.textContent = Number(n.score || 0).toLocaleString('en-US'); n.sc.classList.remove('num-img'); }
    else for (const n of nums) Digits.set(n.sc, n.score);
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  /* ---------- 배경/로고 이미지 적용 (있을 때만) ---------- */
  function applyArt() {
    const bg = (el, key) => { const img = Assets.image(key); if (img) el.style.backgroundImage = `url("${img.src}")`; };
    bg($('screen-title'), Assets.image('titleScreen') && Assets.kit('title21') ? 'titleScreen' : 'title'); bg($('screen-codex'), Assets.image('codexScreen') && Assets.kit('codex25') ? 'codexScreen' : 'title'); bg($('screen-settings'), Assets.image('settingsScreen') && Assets.kit('opt32') ? 'settingsScreen' : 'title');
    bg($('screen-game'), Assets.image('gameScreen') && Assets.kit('play38') ? 'gameScreen' : 'game');
    bg($('screen-gameover'), 'gameover'); bg($('screen-ranking'), Assets.image('rankingScreen') && Assets.kit('rank29') ? 'rankingScreen' : 'gameover');
    // 배경 오버레이 (v1.4): 받은 그림 그대로 한 장씩 겹침. 별빛은 투명도만 천천히 바꿔 반짝이게
    for (const [key, cls] of [['dustOverlay', 'ov-dust'], ['starsOverlay', 'ov-stars']]) {
      const img = Assets.image(key);
      if (!img) continue;
      const ovScreens = ['screen-game', 'screen-gameover', 'screen-codex', 'screen-settings', 'screen-ranking'];
      if (!Assets.kit('title21')) ovScreens.unshift('screen-title');   // 타이틀 v2.1 배경에는 오버레이를 얹지 않음 (아트 미리보기와 같게)
      if (Assets.kit('rank29')) ovScreens.splice(ovScreens.indexOf('screen-ranking'), 1);   // 랭킹 v2.9 배경판은 완성 그림 한 장 (겹쳐 그리지 않음)
      if (Assets.kit('opt32')) ovScreens.splice(ovScreens.indexOf('screen-settings'), 1);   // 옵션 v3.2 배경판도 완성 그림 한 장
      if (Assets.kit('play38')) ovScreens.splice(ovScreens.indexOf('screen-game'), 1);   // 플레이 v3.8 스킨도 완성 그림 한 장
      for (const id of ovScreens) {
        const scr = $(id);
        if (scr.querySelector('.' + cls)) continue;
        const ov = document.createElement('div');
        ov.className = 'bg-overlay ' + cls; ov.style.backgroundImage = `url("${img.src}")`;
        scr.prepend(ov);
      }
    }
    const stage = document.getElementById('stage');
    for (const k of Object.keys(CONFIG.assets.uiKits)) stage.classList.toggle('ui-' + k, Assets.kit(k));
    stage.classList.toggle('has-logo', !!Assets.image('logo'));
    const logo = Assets.image('logo');
    if (logo) { $('title-logo').innerHTML = ''; $('title-logo').appendChild(logo.cloneNode()); }
    document.querySelectorAll('img.deco[data-art]').forEach((el) => {
      const img = Assets.image(el.dataset.art);
      if (img) { el.src = img.src; el.classList.add('on'); }
    });
    const mascot = Assets.image('mascotTop');
    $('gameover-mascot').style.backgroundImage = `url("${mascot ? mascot.src : (Assets.getSprite(0).toDataURL ? Assets.getSprite(0).toDataURL() : Assets.getSprite(0).src)}")`;
  }

  function init() {
    Icons.apply();
    bindActions();
    bindRegister();
    buildEvoList();
    applyArt();
    Digits.set($('hud-score'), 0);
    Digits.set($('hud-best'), Store.get().best);
  }

  return {
    init, show, showOverlay, setScore, setNext, setMaxTier, onDiscover, onSeen, onGameOver, actions, confirmDialog,
    get current() { return current; },
    setLoading: (p) => { $('loading-fill').style.width = Math.round(p * 100) + '%'; },
  };
})();

</script>
<script>
/* =========================================================
 * 이미지 자리 표시 모드 (아트 작업 확인용)
 *  켜기: 주소 끝에 ?slots  또는  F2 (어느 화면에서든 켜고 끄기)
 *  - HTML 요소: data-slot 이 붙은 요소에 점선 테두리 + "파일명 · 원본 크기"
 *  - 게임 캔버스: 유리 상자 / 드로퍼 / 오브젝트는 game.js 가 직접 그림 (Game.setSlots)
 *  표시되는 테두리는 '지금 화면에서 그 그림이 차지하는 자리'. 원본 크기는 이름표에 적힌 값
 * ========================================================= */
const Slots = (() => {
  let on = false, layer = null, timer = null;

  function ensureLayer() {
    if (layer) return layer;
    layer = document.createElement('div');
    layer.id = 'slot-layer';
    document.getElementById('stage').appendChild(layer);
    return layer;
  }

  function draw() {
    const L = ensureLayer();
    L.innerHTML = '';
    if (!on) return;
    const stage = document.getElementById('stage').getBoundingClientRect();
    const k = stage.width / CONFIG.stage.width;
    document.querySelectorAll('#stage [data-slot]').forEach((el) => {
      const r = el.getBoundingClientRect();
      if (!r.width || !r.height || getComputedStyle(el).opacity === '0') return;   // 숨겨진 요소 제외
      const x = (r.left - stage.left) / k, y = (r.top - stage.top) / k, w = r.width / k, h = r.height / k;
      const isBg = el.tagName === 'SECTION';
      const box = document.createElement('div');
      box.className = 'slot-box' + (isBg ? ' bg' : '');
      Object.assign(box.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
      const tag = document.createElement('div');
      tag.className = 'slot-tag';
      tag.textContent = el.dataset.slot + (isBg ? '' : `  [화면 ${Math.round(w)}×${Math.round(h)}]`);
      if (!isBg && x + 300 > CONFIG.stage.width) tag.classList.add('right');   // 오른쪽 끝 요소는 이름표를 오른쪽 정렬
      box.appendChild(tag);
      L.appendChild(box);
    });
  }

  function set(v) {
    on = v;
    document.getElementById('stage').classList.toggle('show-slots', on);
    if (typeof Game !== 'undefined' && Game.setSlots) Game.setSlots(on);
    clearInterval(timer);
    if (on) timer = setInterval(draw, 300);   // 화면 전환·애니메이션을 따라가도록 주기적으로 다시 그림
    draw();
  }

  function init() {
    window.addEventListener('keydown', (e) => { if (e.key === 'F2') { e.preventDefault(); set(!on); } });
    if (/[?&]slots\b/.test(location.search)) set(true);
  }

  return { init, set, get on() { return on; } };
})();

</script>
<script>
/* =========================================================
 * 부트스트랩: 스테이지 스케일, 입력, 초기화
 * 입력: 마우스/터치 이동 → 드로퍼 이동, 클릭/터치 떼기 → 드롭
 *       키보드 ←/→ (A/D) 이동, Space/Enter 드롭, Esc/P 일시정지
 * ========================================================= */
(() => {
  const stage = document.getElementById('stage');
  let scale = 1, offX = 0, offY = 0;

  function fit() {
    const { width, height } = CONFIG.stage;
    scale = Math.min(window.innerWidth / width, window.innerHeight / height);
    offX = (window.innerWidth - width * scale) / 2;
    offY = (window.innerHeight - height * scale) / 2;
    stage.style.transform = `translate(${offX}px, ${offY}px) scale(${scale})`;
  }
  window.addEventListener('resize', fit);
  fit();

  const toStageX = (clientX) => (clientX - offX) / scale;

  /* ---------- 플레이 입력 ---------- */
  const gameScreen = document.getElementById('screen-game');
  const inUI = (e) => e.target.closest('button, .evo-panel, .hud-left');

  gameScreen.addEventListener('pointermove', (e) => Game.setPointerX(toStageX(e.clientX)));
  gameScreen.addEventListener('pointerdown', (e) => {
    if (inUI(e)) return;
    Sound.unlock();
    Game.setPointerX(toStageX(e.clientX));
  });
  gameScreen.addEventListener('pointerup', (e) => {
    if (inUI(e) || Game.state !== 'playing') return;
    Game.setPointerX(toStageX(e.clientX));
    Game.drop();
  });

  window.addEventListener('keydown', (e) => {
    if (UI.current !== 'game') return;
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
      if (Game.state === 'playing') UI.actions.pause();
      else if (Game.state === 'paused') UI.actions.resume();
      return;
    }
    if (Game.state !== 'playing') return;
    if (e.key === 'ArrowLeft' || e.key === 'a') Game.nudge(-24);
    if (e.key === 'ArrowRight' || e.key === 'd') Game.nudge(24);
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); Game.drop(); }
  });

  // 탭이 숨겨지면 자동 일시정지
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && Game.state === 'playing') UI.actions.pause();
  });

  /* ---------- 부팅 ---------- */
  async function boot() {
    Store.load();
    Sound.preload();
    await Assets.loadAll(UI.setLoading);
    await Digits.load();
    if (Assets.kit('play38') && CONFIG.board38) Object.assign(CONFIG.board, CONFIG.board38);   // 플레이 v3.8 스킨 좌표
    Game.init(document.getElementById('game-canvas'), {
      onScore: UI.setScore,
      onNext: UI.setNext,
      onMaxTier: UI.setMaxTier,
      onDiscover: UI.onDiscover,
      onSeen: UI.onSeen,
      onGameOver: UI.onGameOver,
    });
    UI.init();
    Slots.init();
    setTimeout(() => UI.show('title'), 200);
  }
  boot();
})();

</script>
