# 토몽이와 이지의 방 — 랭킹 서버
name = "tomong-rank"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# 게임이 올라가 있는 주소 (쉼표로 여러 개). 이 주소에서만 랭킹 서버를 부를 수 있음
ALLOWED_ORIGINS = "https://audioaudio.github.io,http://localhost:8765,http://127.0.0.1:8765"

[[d1_databases]]
binding = "DB"
database_name = "tomong-rank"
# 의뢰자가 미리 만든 D1 데이터베이스
database_id = "9d9296ef-8f56-452f-93b1-c46eb2218586"

# 관리자 토큰(기록 삭제용)은 'npx wrangler secret put ADMIN_TOKEN' 으로 따로 넣습니다 (이 파일에 쓰지 않음)
